services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18843/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      BOUJOY_RELAY_TRUSTED_PROXY: caddy
    secrets:
      - source: routes
        target: routes.json
    networks: [relay]
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["443:443", "443:443/udp", "80:80"]
    environment:
      BOUJOY_RELAY_DOMAIN: ${BOUJOY_RELAY_DOMAIN:?set public relay IPv4 or domain}
    volumes:
      - ${BOUJOY_RELAY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
secrets:
  routes:
    file: ${BOUJOY_RELAY_ROUTES_FILE:?set route hash file path}
networks:
  relay:
volumes:
  caddy_data:
  caddy_config:
