<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Boujoy · 你的个人助理</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./groups.css"></head>
<body><div id="app"><aside id="sidebar" aria-label="助理列表"><header class="sidebar-head"><a class="brand" href="#role/concierge" aria-label="Boujoy 首页">boujoy<span class="brand-dot"></span></a><div class="sidebar-top-actions"><button class="icon-button mobile-close" data-action="close-sidebar" aria-label="关闭助理列表"><img class="icon" src="/icons/x.svg" alt=""></button><button class="icon-button" data-action="search" aria-label="搜索助理或对话" title="搜索 · ⌘ K"><img class="icon" src="/icons/search.svg" alt=""></button><button class="icon-button" data-action="new-role" aria-label="新建助理" title="新建助理"><img class="icon" src="/icons/plus.svg" alt=""></button></div></header><div class="roster-heading">我的助理<span id="role-count"></span></div><nav id="role-nav"></nav><div class="sidebar-footer"><button class="group-entry" data-action="groups"><img class="icon" src="/icons/menu.svg" alt=""><span>群聊</span></button><div class="utility-nav"><button data-action="workbench"><img class="icon" src="/icons/briefcase.svg" alt=""><span>工作台</span><span id="workbench-count" class="counter"></span></button><button data-action="memory"><img class="icon" src="/icons/book-open.svg" alt=""><span>记忆</span><span id="memory-count" class="counter"></span></button><button data-action="routines"><img class="icon" src="/icons/clock.svg" alt=""><span>例行事务</span><span id="routine-count" class="counter"></span></button></div><button class="workspace" data-action="settings" aria-label="设置" title="设置"><span class="workspace-avatar">B</span><span class="workspace-text">设置<small id="connection-label">正在连接这台 Mac</small></span><img class="icon" src="/icons/settings.svg" alt="设置"></button></div></aside><button id="sidebar-backdrop" tabindex="-1" aria-label="收起助理列表"></button><main id="chat"><header id="chat-header"></header><div id="timeline" tabindex="0" aria-label="聊天记录"><div class="loading-state">正在连接你的助理…</div></div><div id="composer-container"></div></main></div><div id="toast" role="status" aria-live="polite"></div><dialog id="sheet" aria-labelledby="sheet-title"><header class="sheet-header"><h2 id="sheet-title"></h2><button class="icon-button" data-action="close-sheet" aria-label="关闭"><img class="icon" src="/icons/x.svg" alt=""></button></header><div id="sheet-body"></div></dialog><script defer src="./app.js"></script><script defer src="./robot-motion.js"></script><script defer src="./groups.js"></script></body></html>
