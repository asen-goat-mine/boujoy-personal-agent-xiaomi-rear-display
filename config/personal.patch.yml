# Personal mode only exposes brokered MCP tools. No unrestricted shell/file tools.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: tool-working-directory
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: sessions
  disabled: true
- id: llm-deepseek
  config:
    baseURL: http://127.0.0.1:1
    streamIdleTimeoutMs: 120000
    maxTokens: 8192
    maxRequestFilesBytes: 15000000
    imageOffloadByteQuantum: 5000000
    maxInlineRequestImageBytes: 20000000
    models:
      - id: deepseek-flash
        name: DeepSeek Flash
        # Verified by upstream error capacity on 2026-10-31; enables proactive compaction.
        contextWindow: 1048576
        inputModalities: [text, image]
- insert:
    - id: personal-attachments
      name: '@deepseek-ai/dsh-attachment-local'
    - id: personal-tools
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: personal
        transport: stdio
        command: node
        args: []
        env:
          BOUJOY_INTERNAL_URL: http://127.0.0.1:1
          BOUJOY_RUNTIME_TOKEN: runtime-placeholder
        toolCallTimeoutMs: 240000
        failOnStartupError: true
